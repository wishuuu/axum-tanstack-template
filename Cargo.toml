[package]
name = "{{project_name}}"
version = "0.1.0"
edition = "2024"
authors = [ "{{authors}}" ]

[lib]
path = "src/lib.rs"
name = "{{project_name}}"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

axum = { version = "0.7.5", features = ["http2", "tokio", "http1", "json"] }
axum-extra = { version = "0.9.3", features = ["form", "query", "tracing", "async-read-body"]}
axum-prometheus = {version = "0.7.0", features = ["default"]}

metrics-exporter-prometheus = "0.15.0"

tower = { version = "0.5.1", features = ["full"] }
tower-cookies = { version = "0.10.0", features = ["default", "axum-core"] }
tower-http = { version = "0.6.1", features = ["full"] }
tower-sessions = { version = "0.13.0" }

tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3"
tracing = { version = "0.1", features = ["log"] }
tracing-log = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

config = "0.14"
uuid = {version = "1", features = ["v4", "serde"]}
chrono = {version="0.4.22", default-features = false, features = ["clock"]}
secrecy = { version = "0.8", features = ["serde"] }
unicode-segmentation = "1"
validator = "0.20.0"
http = "1.1.0"
jsonwebtoken = "9.3.0"
lazy_static = "1.4.0"
metrics = "0.24.0"
argon2 = "0.5.3"
rand ="0.8"

[dependencies.sqlx]
version = "0.8"
default-features = false
features = [
  "runtime-tokio-rustls",
  "macros",
  "postgres",
  "uuid",
  "chrono",
  "migrate"
]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
claims = "0.7"
fake = "2.9"
quickcheck = "1.0.3"
quickcheck_macros = "1"
rand ="0.8"
wiremock = "0.6"
serde_json = "1.0"
passwords = "3.1.16"
